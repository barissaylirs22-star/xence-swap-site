# Deploy only the Vite production build (./dist) to GitHub Pages.
# Triggers: push to v2, or manual workflow_dispatch.
# Does not publish source, secrets, .data, node_modules, or Worker files.
#
# After first push of this workflow, set repo Settings → Pages → Source
# to "GitHub Actions" (required once). Custom domain axiom-swap.xyz stays
# in dist/CNAME via public/CNAME. Cloudflare Worker /api/* routes are
# independent and continue to intercept API traffic ahead of Pages.

name: Deploy Axiom V2 to GitHub Pages

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist/CNAME for custom domain
        run: |
          test -f dist/CNAME
          grep -qx 'axiom-swap.xyz' dist/CNAME
          test -f dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
